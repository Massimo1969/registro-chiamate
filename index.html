<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16233f">
<title>Registro Chiamate</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app a schermo intero per telefono. Barra in alto, contenuto che scorre, 5 schede in basso. */
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#16233f; --ink2:#5b6780; --line:#d5dbe6;
  --accent:#2447d6; --accent-ink:#ffffff;
  --good:#12805c; --warn:#b26a00; --crit:#c0342c; --info:#2447d6; --mute:#6b7488;
  --good-bg:#dff3ea; --warn-bg:#fbeccd; --crit-bg:#fbe1de; --info-bg:#e0e7fd; --mute-bg:#e6e9f0;
  --display:"Archivo",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1524; --card:#18223a; --ink:#e9edf7; --ink2:#9aa6c0; --line:#2b3857;
    --accent:#7d98ff; --accent-ink:#0e1524;
    --good:#4fd1a1; --warn:#f0b455; --crit:#ff8a80; --info:#9db1ff; --mute:#9aa6c0;
    --good-bg:#12382d; --warn-bg:#40300f; --crit-bg:#45201d; --info-bg:#1f2c57; --mute-bg:#243049;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1524; --card:#18223a; --ink:#e9edf7; --ink2:#9aa6c0; --line:#2b3857;
  --accent:#7d98ff; --accent-ink:#0e1524;
  --good:#4fd1a1; --warn:#f0b455; --crit:#ff8a80; --info:#9db1ff; --mute:#9aa6c0;
  --good-bg:#12382d; --warn-bg:#40300f; --crit-bg:#45201d; --info-bg:#1f2c57; --mute-bg:#243049;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:12px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:19px;font-weight:800}
header span{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:11px 2px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);border-top:3px solid transparent;position:relative}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
nav .dot{position:absolute;top:5px;right:calc(50% - 26px);background:var(--crit);color:#fff;border-radius:9px;font-size:10.5px;min-width:18px;padding:1px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-good{background:var(--good-bg);color:var(--good)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.t-crit{background:var(--crit-bg);color:var(--crit)} .t-info{background:var(--info-bg);color:var(--info)}
.t-mute{background:var(--mute-bg);color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font-weight:600;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:7px 11px;font-size:14px}
.callbtn{display:block;background:var(--good);color:#fff;border-radius:14px;padding:18px;text-align:center;font:800 21px var(--display);text-decoration:none;letter-spacing:.2px}
:root[data-theme="dark"] .callbtn{color:#06231a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .callbtn{color:#06231a}}
.who{font:800 25px/1.15 var(--display);overflow-wrap:anywhere}
.phone{font:700 19px var(--display);font-variant-numeric:tabular-nums;letter-spacing:.4px}
input[type=text],input[type=date],input[type=tel],input[type=search],input[type=number],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.item b{display:block;overflow-wrap:anywhere}
.item small{color:var(--ink2);font-variant-numeric:tabular-nums}
.item.late{border-left:5px solid var(--crit)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{font:800 26px var(--display);font-variant-numeric:tabular-nums;display:block}
.tile span{font-size:13px;color:var(--ink2)}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--accent);min-width:2px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dialnum{font:800 26px var(--display);letter-spacing:1px;min-height:44px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--line);font-variant-numeric:tabular-nums}
.dialnum .muted{font:400 14px var(--body);letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:1px solid var(--line);background:var(--bg);border-radius:12px;height:52px;font:700 23px var(--display)}
.key:active{background:var(--info-bg)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--ink2);white-space:normal;min-width:62px;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);white-space:nowrap}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
.zero{color:var(--line)}
.subtabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.subtabs button{flex:1;border:0;background:none;padding:9px 4px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.subtabs button+button{border-left:1px solid var(--line)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
details.card{padding:16px}
details>summary{cursor:pointer;font-weight:700;font-size:14.5px}
details>summary h3{display:inline;font-size:17px}
details[open]>summary{margin-bottom:10px}
details>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500;color:var(--ink);font-size:14.5px}
label.check input{width:20px;height:20px;flex:none;margin:1px 0 0}
.goal{height:10px;border-radius:5px;background:var(--mute-bg);overflow:hidden}
.goal i{display:block;height:100%;background:var(--good);border-radius:5px}
.script{white-space:pre-wrap;font-size:15px;line-height:1.5}
table.heat td{text-align:center;min-width:54px}
table.heat td:first-child{text-align:left;min-width:0}
table.heat small{display:block;font-size:10.5px;color:var(--ink2)}
.pipe{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.pcol{flex:0 0 250px;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.pcol h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar span small{color:var(--ink2)}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 8px;font-weight:700;font-size:14.5px}
.out[aria-pressed="true"]{border-color:var(--accent);background:var(--info-bg)}
.overlay{position:fixed;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:19px}
.hist{border-top:1px solid var(--line);padding-top:8px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90%}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600}
.dur{display:flex;gap:8px;align-items:center}
.dur input{width:76px;text-align:center;font:700 19px var(--display)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>
</head>
<body>
<header><h1>Registro Chiamate</h1><span id="hdr"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheetHost"></div>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
/* ====================== CONFIGURAZIONE — modifica qui ======================
   Esiti della chiamata. Per aggiungerne uno, copia una riga e cambia id e label.
   tone:  good | warn | crit | info | mute   (colore dell'etichetta)
   retry: true  = il contatto torna in coda per un altro tentativo
   date:  'req' = data obbligatoria, 'opt' = data facoltativa
   reached: true = conta come "contatto raggiunto" nelle statistiche
   block: true  = il contatto non può più essere chiamato                    */
const OUTCOMES = [
  {id:'no_answer',      label:'Non risponde',         tone:'mute', retry:true},
  {id:'busy',           label:'Occupato',             tone:'mute', retry:true},
  {id:'callback',       label:'Richiamare',           tone:'warn', date:'req', reached:true},
  {id:'interested',     label:'Interessato',          tone:'info', date:'opt', reached:true},
  {id:'appointment',    label:'Appuntamento fissato', tone:'good', date:'req', reached:true},
  {id:'customer',       label:'Cliente',              tone:'good', reached:true},
  {id:'not_interested', label:'Non interessato',      tone:'crit', reached:true},
  {id:'wrong',          label:'Numero errato',        tone:'crit'},
  {id:'dnc',            label:'Non chiamare più',     tone:'crit', reached:true, block:true},
];
const APP_VERSION = '2.2 del 12/11/2026';
const DEFAULTS = { prefix:'+39', maxAttempts:4, goal:50, smart:false, script:'' };
const APPT_MINUTES = 30;   // durata di un appuntamento in Google Calendar (i richiami durano 15 minuti)   // prefisso per numeri senza +, tentativi massimi a vuoto
// Link Zoom fisso per gli appuntamenti e link Zoom Scheduler per far scegliere l'orario al contatto
const ZOOM_LINK = 'https://us06web.zoom.us/j/86262800075?pwd=xcQNNSd18dgStUa4IcaSqJ0b0G7GIK.1';
const SCHEDULER_LINK = 'https://scheduler.zoom.us/massimo-morvillo/appuntamento-con-massimo-morvillo';
// Messaggi WhatsApp. {giorno} {ora} {zoom} {link} vengono sostituiti dall'app.
const MSG_CONFERMA = `Buongiorno, le confermo il nostro appuntamento su Zoom di {giorno} alle {ora}.

Per collegarsi basta toccare questo link:
{zoom}

A presto,
Massimo Morvillo`;
const MSG_PRENOTA = `Buongiorno, come d'accordo le lascio il link per scegliere il giorno e l'ora del nostro appuntamento su Zoom:
{link}

A presto,
Massimo Morvillo`;
// Elenchi per i campi facoltativi. Puoi aggiungere o togliere voci: le chiamate già registrate non cambiano.
const SERVICES = ['Trading Room','Contratto annuale di analisi','Entrambi'];
const WHO = ['Titolare','Segreteria','Collaboratore','Familiare','Segreteria telefonica'];
const REASONS = ['Prezzo','Non ha tempo','Ha già un fornitore','Non investe','Non si fida','Altro'];
const OBJECTIONS = ['Costa troppo','Devo pensarci','Mandami una mail','Non mi interessa','Ho già chi mi segue','Non ho tempo','Nessuna'];
const STAGES = ['Apertura','Presentazione','Proposta','Chiusura'];
const SCRIPTS = ['Script A','Script B','Script C'];
const CHANNELS = ['Telefono','WhatsApp','Email'];
const INVESTS = ['Banca','Consulente','Fai da te','Non investe'];
const EXPERIENCE = ['Nessuna','Base','Avanzata'];
const CAPITAL = ['Non dichiarato','Fino a 10.000 €','10.000-50.000 €','50.000-250.000 €','Oltre 250.000 €'];
const DECIDERS = ['Da solo','Con il socio','Con il coniuge','Altri'];
const APPT_RESULTS = ['Svolto','Saltato','Rinviato'];
const NOCLOSE = ['Prezzo','Vuole pensarci','Ha scelto altro','Non è il momento','Altro'];
// I 10 script per la prima chiamata conoscitiva. Si modificano dall'app, scheda Dati.
const DEFAULT_SCRIPTS = [
{name:'1. Diretto e breve', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista finanziario. La chiamo per un motivo preciso e le rubo un minuto.

Mi occupo di analisi e ricerca su strumenti finanziari: seleziono azioni italiane, europee e americane con un modello quantitativo e documento ogni scelta.
Non vendo prodotti e non do consigli personalizzati: fornisco ricerca.

DOMANDA: oggi come sceglie i titoli che segue?
[ascolta]

PROPOSTA: le propongo 20 minuti su Zoom per mostrarle come lavoro, senza impegno. Preferisce domani o dopodomani?`},
{name:'2. Domanda sul metodo attuale', text:`Buongiorno [Nome], sono Massimo Morvillo, analista finanziario. Ha un minuto? Le faccio solo una domanda.

DOMANDA: quando deve valutare un titolo azionario, su cosa si basa oggi? Analisi sue, report della banca, notizie?
[ascolta]
E quanto tempo le porta via ogni settimana?
[ascolta]

Glielo chiedo perché il mio lavoro è proprio questo: ricerca quantitativa su azioni italiane, europee e americane, con ogni scelta documentata.

PROPOSTA: in 20 minuti su Zoom le mostro un esempio concreto e valuta lei se le è utile. Quando le è più comodo?`},
{name:'3. Il modello quantitativo', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista. Le spiego in trenta secondi perché la chiamo.

Ho costruito un modello quantitativo che seleziona le azioni in base ai numeri, non alle opinioni: regole fisse, uguali per ogni titolo, sui mercati italiano, europeo e americano.

DOMANDA: molti professionisti mi dicono che il problema non è trovare informazioni, ma distinguere quelle che contano. Capita anche a lei?
[ascolta]

PROPOSTA: mi piacerebbe mostrarle come funziona il modello e che tipo di analisi produce. Bastano 20 minuti su Zoom. Le va bene questa settimana?`},
{name:'4. Tra professionisti del settore', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista finanziario. La chiamo da persona del settore, e sarò breve.

Produco ricerca non legata alla vendita di alcun prodotto: analisi quantitativa su azioni italiane, europee e americane, con un metodo documentato.

DOMANDA: lei oggi da dove prende la ricerca che usa per farsi un'idea sui mercati?
[ascolta]
Cosa le manca in quello che riceve?
[ascolta]

PROPOSTA: le propongo un confronto di 20 minuti su Zoom. Le mostro come lavoro e mi dice lei se può esserle utile. Che giorno preferisce?`},
{name:'5. Chiedo il permesso', text:`Buongiorno [Nome], sono Massimo Morvillo. Non ci conosciamo e so di chiamarla senza preavviso: mi concede 30 secondi per dirle perché, e poi decide lei se continuare?
[attendi il sì]

Grazie. Sono trader e analista finanziario: faccio analisi e ricerca su azioni con un modello quantitativo. Mi rivolgo a professionisti e imprenditori che seguono i mercati ma hanno poco tempo per analizzarli.

DOMANDA: è un tema che la riguarda?
[ascolta]

PROPOSTA: allora le propongo 20 minuti su Zoom, nel giorno che preferisce, per farle vedere un esempio di analisi. Se non le interessa me lo dice, e non la disturbo più.`},
{name:'6. Il tempo che manca', text:`Buongiorno [Nome], sono Massimo Morvillo, analista finanziario. Una domanda veloce, se ha un minuto.

DOMANDA: seguire i mercati richiede ore, tra bilanci, grafici e notizie. Lei quanto tempo riesce a dedicarci in una settimana?
[ascolta]

È il motivo per cui molti professionisti si appoggiano alla ricerca di chi lo fa di mestiere. Io analizzo ogni giorno azioni italiane, europee e americane con un modello quantitativo, e consegno analisi già pronte e documentate.

PROPOSTA: le mostro un esempio in 20 minuti su Zoom, così valuta quanto tempo le farebbe risparmiare. Meglio la mattina o il pomeriggio?`},
{name:'7. Tutto documentato', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista finanziario. Le dico subito perché la chiamo.

Nel mio settore tutti hanno un'opinione, pochi la mettono per iscritto prima. Io documento ogni analisi: perché un titolo entra nella selezione, con quali criteri, e quando esce.
Non prometto risultati: mostro il metodo e lascio parlare i documenti.

DOMANDA: le è mai capitato di chiedersi su cosa si basano le analisi che legge?
[ascolta]

PROPOSTA: in 20 minuti su Zoom le faccio vedere com'è fatto un mio report. Quando possiamo sentirci?`},
{name:'8. Un secondo punto di vista', text:`Buongiorno [Nome], sono Massimo Morvillo, analista finanziario. Le rubo un minuto.

Non le chiedo di cambiare nulla di quello che fa oggi. Le propongo un secondo punto di vista: ricerca su azioni fatta con un modello quantitativo, non legata alla vendita di alcun prodotto.

DOMANDA: oggi, quando legge un'analisi su un titolo, ha modo di confrontarla con un'altra fonte?
[ascolta]

Io fornisco analisi e ricerca, non consigli personalizzati: le decisioni restano sue.

PROPOSTA: le mostro un esempio in 20 minuti su Zoom, senza impegno. Le andrebbe bene nei prossimi giorni?`},
{name:'9. Per chi ha un\'azienda da seguire', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista finanziario. So che è impegnato, sarò breve.

Lavoro con imprenditori e professionisti che seguono i mercati azionari ma hanno un'attività a cui pensare.

DOMANDA: lei i mercati li segue personalmente, o si affida a qualcuno?
[ascolta]
E si sente informato quanto vorrebbe?
[ascolta]

PROPOSTA: le propongo 20 minuti su Zoom per mostrarle un esempio. Qual è il momento migliore per lei?`},
{name:'10. Le mando un esempio', text:`Buongiorno [Nome], sono Massimo Morvillo, trader e analista finanziario. La chiamo per una cosa semplice.

DOMANDA: prima però le chiedo quali mercati segue di più. Italia, Europa o Stati Uniti?
[ascolta]

PROPOSTA: perfetto, le preparo un esempio su quello. Per spiegarglielo bene bastano 20 minuti su Zoom: lo guardiamo insieme e mi fa le sue domande. Le va meglio domani o dopodomani?
[chiedi dove inviarlo: email o WhatsApp]`}
];
const DEFAULT_OBJ = `«Costa troppo»
Capisco. Prima del prezzo conta se le è utile: per questo le propongo di vedere un esempio in 20 minuti. Poi valuta lei.

«Devo pensarci»
Giusto. Su cosa in particolare vuole riflettere? Magari le rispondo subito, oppure lo vediamo insieme su Zoom.

«Mi mandi una mail»
Volentieri. Per mandarle qualcosa di utile e non generico: quali mercati segue di più?

«Non mi interessa»

«Ho già chi mi segue»
Bene, e non le chiedo di cambiare. Il mio è un servizio di ricerca: un secondo punto di vista da affiancare a quello che ha già.

«Non ho tempo»
Proprio per questo sarò breve: 20 minuti su Zoom, quando vuole lei, anche la sera.

function normPhone(raw, prefix){
  let s = String(raw||'').trim().replace(/[^\d+]/g,'');
  if(!s) return '';
  if(s.startsWith('00')) s = '+' + s.slice(2);
  s = s[0]==='+' ? '+' + s.slice(1).replace(/\+/g,'') : s.replace(/\+/g,'');
  if(s[0] !== '+') s = prefix + s;
  return s.length >= 8 ? s : '';
}
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';','\t',','].map(d=>[d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

function applyOutcome(c, o, v, OUTMAP){
  if(v.edit && c.calls.length){
    const k = c.calls[c.calls.length-1];
    if(k.outcome!==o.id && !k.prev) k.prev = k.outcome;
    k.outcome=o.id; k.dur=v.dur; k.note=v.note; k.edited=v.now;
  } else { c.calls.push({at:v.now, dur:v.dur, outcome:o.id, note:v.note}); c.lastCallAt=v.now; }
  c.status=o.id; c.attempts=trailingRetries(c,OUTMAP); c.callbackAt = o.date ? v.when : null;

}

function attemptStats(list, a, b, OUTMAP){
  const rows = [1,2,3,4,5].map(t=>({t,n:0,reached:0,by:{}}));
  const f = {called:0, calls:0, reached:0, interested:0, appointment:0, customer:0, multi:0};
  const toAppt=[], toCust=[];
  for(const c of list){
    const calls = (c.calls||[]).slice().sort((x,y)=>x.at-y.at);
    let any=0, fl={};
    calls.forEach((k,i)=>{
      if(k.at<a || k.at>b) return;
      any++; f.calls++;
      const r = rows[Math.min(i+1,5)-1]; r.n++; r.by[k.outcome]=(r.by[k.outcome]||0)+1;
      const o = OUTMAP[k.outcome];
      if(o && o.reached){ r.reached++; fl.reached=1; }
      if(k.outcome==='interested') fl.interested=1;
      if(k.outcome==='appointment'){ if(!fl.appointment) toAppt.push(i+1); fl.appointment=1; }
      if(k.outcome==='customer'){ if(!fl.customer) toCust.push(i+1); fl.customer=1; }
    });
    if(!any) continue;
    f.called++; if(any>1) f.multi++;
    for(const k of ['reached','interested','appointment','customer']) if(fl[k]) f[k]++;
  }
  const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : 0;
  return {rows, f, avgAppt:avg(toAppt), avgCust:avg(toCust)};
}

  if(!f.called) return '';
  const pct = (x,y)=> y ? Math.round(x/y*100)+'%' : '0%';
  const one = v => v ? v.toFixed(1).replace('.',',') : 'n.d.';
  const cell = v => v ? v : '<span class="zero">·</span>';
  const steps = [['Contatti chiamati',f.called],['Raggiunti almeno una volta',f.reached],['Interessati',f.interested],['Con appuntamento',f.appointment],['Diventati clienti',f.customer]];
  const names = ['1ª chiamata','2ª chiamata','3ª chiamata','4ª chiamata','5ª o successive'];
  return `<div class="card"><h3>Cosa succede contatto per contatto</h3>
    <div class="muted">Qui si contano le persone, non le telefonate: un contatto chiamato tre volte vale uno.</div>
    <div class="tiles">
      <div class="tile"><b>${f.called}</b><span>Contatti chiamati</span></div>
      <div class="tile"><b>${one(f.calls/f.called)}</b><span>Chiamate per contatto, in media</span></div>
      <div class="tile"><b>${f.multi}</b><span>Contatti chiamati più di una volta (${pct(f.multi,f.called)})</span></div>
      <div class="tile"><b>${one(s.avgAppt)}</b><span>Chiamate per arrivare a un appuntamento, in media</span></div>
    </div>
    ${steps.map(([l,v])=>`<div class="bar"><span>${l}</span><i style="width:${v/f.called*100}%"></i><em>${v}</em></div>`).join('')}
    <div class="muted">Su 100 contatti chiamati: ${pct(f.reached,f.called)} raggiunti, ${pct(f.interested,f.called)} interessati, ${pct(f.appointment,f.called)} con appuntamento, ${pct(f.customer,f.called)} clienti.${s.avgCust?` Per fare un cliente servono in media ${one(s.avgCust)} chiamate.`:''}</div>
    <h3>Esito per numero di tentativo</h3>
    <div class="muted">Cosa succede alla prima chiamata a un contatto, alla seconda, alla terza e così via.</div>
    <div class="tblwrap"><table><thead><tr><th>Tentativo</th><th>Chiamate</th><th>Risposte</th>${OUTCOMES.map(o=>`<th>${esc(o.label)}</th>`).join('')}</tr></thead>
      <tbody>${s.rows.filter(r=>r.n).map(r=>`<tr><td>${names[r.t-1]}</td><td><b>${r.n}</b></td><td>${pct(r.reached,r.n)}</td>${OUTCOMES.map(o=>`<td>${cell(r.by[o.id])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  </div>`;
}

const FIELDS = [
  ['phone','Telefono (obbligatorio)',[/^(phone|telefono|tel)$/i,/mobile|cell/i,/tel|phone|numero/i]],
  ['name','Nome',/^(nome|first.?name|name|nominativo|contatto|contact)/i],
  ['surname','Cognome',/cognome|last.?name|surname/i],
  ['company','Azienda',/azienda|company|societ|ragione|account/i],
  ['city','Città',/citt|city|comune|localit/i],
  ['email','Email',/mail/i],
  ['info','Categoria o ruolo',[/categoria|category/i,/title|ruolo|qualifica/i,/note|comment/i]],
  ['desc','Descrizione del CRM',/descri/i],
];
let impRows=null, impHead=null;
function importSheet(rows, fileName){
  impHead = rows[0].map(h=>h.trim()); impRows = rows.slice(1);
  const used = new Set();
  const sel = ([key,label,re])=>{
    let g=-1; for(const r of (Array.isArray(re)?re:[re])){ g = impHead.findIndex((h,i)=>r.test(h) && !used.has(i)); if(g>=0) break; }
    if(g>=0) used.add(g);
    return `<label>${label}<select id="map_${key}"><option value="-1">Nessuna colonna</option>${impHead.map((h,i)=>`<option value="${i}" ${i===g?'selected':''}>${esc(h||'Colonna '+(i+1))}</option>`).join('')}</select></label>`;
  };
  sheet(`<h2>Importa ${impRows.length.toLocaleString('it-IT')} righe</h2>
    <p class="muted">Controlla che ogni campo punti alla colonna giusta del file. Se il telefono principale è vuoto, l'app prova da sola le altre colonne telefoniche (prima il cellulare).</p>
    ${FIELDS.map(sel).join('')}
    <label>Nome della lista<input type="text" id="impList" value="${esc(fileName.replace(/\.[^.]+$/,''))}"></label>
    <div class="row"><button class="btn grow" data-act="close">Annulla</button><button class="btn primary grow" data-act="doImport">Importa</button></div>`);
}
async function doImport(){
  const idx = Object.fromEntries(FIELDS.map(([k])=>[k, parseInt($('#map_'+k).value)]));
  if(idx.phone<0) return toast('Scegli la colonna del telefono');
  const list = $('#impList').value.trim() || 'Lista';
  const have = new Set(contacts.map(c=>c.phone));
  const get = (r,k)=> idx[k]>=0 ? String(r[idx[k]]||'').trim() : '';
  let dup=0, bad=0; const add=[], t0=Date.now();
  const isMob = i => /mobile|cell/i.test(impHead[i]) ? 1 : 0;
  const alt = impHead.map((h,i)=>i).filter(i=>i!==idx.phone && /phone|mobile|cell|tel/i.test(impHead[i]) && !/fax|ass/i.test(impHead[i])).sort((a,b)=>isMob(b)-isMob(a));
  for(const r of impRows){
    let phone = normPhone(get(r,'phone'), settings.prefix);
    for(const i of alt){ if(phone) break; phone = normPhone(r[i], settings.prefix); }
    if(!phone){ bad++; continue; }
    if(have.has(phone)){ dup++; continue; }
    have.add(phone);
    add.push({id:uid(), name:[get(r,'name'),get(r,'surname')].filter(Boolean).join(' '), first:get(r,'name'), last:get(r,'surname'), company:get(r,'company'), phone,
      city:get(r,'city'), email:get(r,'email'), info:get(r,'info'), desc:get(r,'desc'), list, status:'new', attempts:0, lastCallAt:null, callbackAt:null, note:'', calls:[], createdAt:t0, ord:add.length});
  }
  contacts.push(...add); await saveMany(add);
  impRows=impHead=null; closeSheet(); tab='call'; render();
  toast(`Importati ${add.length}. Doppioni saltati ${dup}, senza numero valido ${bad}.`);
}

  span+=last-s0;

  const refs=contacts.filter(c=>c.profile&&c.profile.ref).length, cons=contacts.filter(c=>c.profile&&c.profile.consent).length;

      <div class="tiles"><div class="tile"><b>${cb.ok}</b><span>Fatti in orario</span></div><div class="tile"><b>${cb.late}</b><span>Fatti in ritardo</span></div>
      <div class="tile"><b>${cb.never}</b><span>Scaduti e mai fatti</span></div><div class="tile"><b>${cb.plan}</b><span>Ancora in programma</span></div></div></div>
    <div class="card"><h3>Interessati fermi da più di 7 giorni: ${idle.length}</h3>
      ${idle.length?`<div class="list">${idle.slice(0,15).map(c=>`<button class="item" data-act="open" data-id="${c.id}"><span class="grow"><b>${esc(cname(c))}</b><small>Ultima chiamata ${esc(fmtDate(c.lastCallAt))}</small></span></button>`).join('')}</div>`:'<div class="muted">Nessuno: stai seguendo tutti gli interessati.</div>'}</div>
    <div class="card"><h3>Quanto dura la lista</h3><div class="tiles">
      <div class="tile"><b>${left.toLocaleString('it-IT')}</b><span>Contatti ancora da chiamare</span></div>
      <div class="tile"><b>${pace?one(pace):'n.d.'}</b><span>Contatti nuovi al giorno (ultimi 14 giorni, nei giorni di lavoro)</span></div>
      <div class="tile"><b>${pace?Math.ceil(left/pace):'n.d.'}</b><span>Giorni di lavoro per finire la lista a questo ritmo</span></div></div></div>
    <div class="card"><h3>Previsione</h3>
      <label>Quanti appuntamenti vuoi ottenere<input type="number" id="fTarget" min="1" value="${statTarget}"></label>
      ${rate?`<div class="tiles"><div class="tile"><b>${need.toLocaleString('it-IT')}</b><span>Chiamate necessarie, al tuo ritmo storico (${one(rate*100)} appuntamenti ogni 100)</span></div>
      <div class="tile"><b>${fmtLong(need*avgDur)}</b><span>Tempo al telefono stimato</span></div></div>`:'<div class="muted">La previsione compare dopo il primo appuntamento fissato.</div>'}</div>
    <div class="card"><h3>Ricavi nel periodo</h3><div class="muted">Dai contratti con valore inserito nella scheda del contatto.</div><div class="tiles">
      <div class="tile"><b>${euro(rev)}</b><span>Contratti chiusi: ${deals.length}</span></div>
      <div class="tile"><b>${ps.length?euro(rev/ps.length):'n.d.'}</b><span>Ricavo per chiamata</span></div>
      <div class="tile"><b>${talk?euro(rev/(talk/3600)):'n.d.'}</b><span>Ricavo per ora di telefono</span></div></div></div>
    <div class="card"><h3>Appuntamenti, tutto lo storico</h3><div class="tiles">
      <div class="tile"><b>${sv+sa?pctS(sv,sv+sa):'n.d.'}</b><span>Tasso di presenza (${sv} svolti, ${sa} saltati)</span></div>
      <div class="tile"><b>${ri}</b><span>Rinviati</span></div></div>
      ${Object.keys(ncMap).length?`<h3>Motivi della mancata chiusura</h3>${Object.entries(ncMap).sort((x,y)=>y[1]-x[1]).map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><i style="width:${v/ncMax*100}%"></i><em>${v}</em></div>`).join('')}`:''}</div>
    <div class="card"><h3>Contatti, tutto lo storico</h3><div class="tiles">
      <div class="tile"><b>${refs}</b><span>Contatti che ti hanno dato referenze</span></div>
      <div class="tile"><b>${cons}</b><span>Hanno autorizzato il ricontatto</span></div></div></div>`;
}

/* ---------- riepilogo di giornata e pipeline ---------- */
function summaryText(){
  const a=startOfDay(Date.now()).getTime(), ps=statPairs(a,Infinity), now=Date.now();
  const L=['Riepilogo del '+new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),'',
    'Chiamate: '+ps.length, 'Tempo al telefono: '+fmtLong(ps.reduce((s,p)=>s+(p.k.dur||0),0)), 'Contatti raggiunti: '+ps.filter(p=>isReached(p.k)).length,'','Esiti:'];
  OUTCOMES.forEach(o=>{ const n=ps.filter(p=>p.k.outcome===o.id).length; if(n) L.push('- '+o.label+': '+n); });
  const ap=ps.filter(p=>p.k.outcome==='appointment');
  if(ap.length){ L.push('','Appuntamenti fissati oggi:'); ap.forEach(p=>L.push('- '+cname(p.c)+(p.c.callbackAt?' il '+fmtDate(p.c.callbackAt):''))); }
  const t0=a+864e5, t1=t0+864e5, tom=agenda().filter(c=>c.callbackAt>=t0 && c.callbackAt<t1), late=agenda().filter(c=>c.callbackAt<now && c.status!=='appointment');
  L.push('','Per domani: '+tom.length+' tra richiami e appuntamenti'); tom.slice(0,15).forEach(c=>L.push('- '+new Date(c.callbackAt).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' '+cname(c)+' ('+statusOf(c).label+')'));
  if(late.length) L.push('','Richiami scaduti da recuperare: '+late.length);
  return L.join('\n');
}
function summarySheet(){
  sheet(`<h2>Riepilogo di oggi</h2><textarea id="sumText" readonly style="min-height:300px">${esc(summaryText())}</textarea>
    <div class="row"><button class="btn grow" data-act="close">Chiudi</button><button class="btn primary grow" data-act="copySum">Copia il testo</button></div>
    <a class="btn" href="https://wa.me/?text=${encodeURIComponent(summaryText())}" target="_blank" rel="noopener">Invia su WhatsApp, scegliendo la chat</a>`);
}
function pipelineView(){
  const cols=['callback','interested','appointment','customer'];
  return `<div class="muted">Da chiamare: <b>${contacts.filter(c=>c.status==='new').length.toLocaleString('it-IT')}</b>. Tocca un contatto per aprire la scheda e cambiarne lo stato.</div>
    <div class="pipe">${cols.map(id=>{ const list=contacts.filter(c=>c.status===id).sort((x,y)=>(x.callbackAt||x.lastCallAt||0)-(y.callbackAt||y.lastCallAt||0));
      return `<div class="pcol"><h3>${esc(OUT[id].label)} <span class="pill t-${OUT[id].tone}">${list.length}</span></h3>
        ${list.slice(0,40).map(c=>`<button class="item" data-act="open" data-id="${c.id}"><span class="grow"><b>${esc(cname(c))}</b><small>${esc(c.callbackAt?fmtDate(c.callbackAt):'Ultima: '+fmtDate(c.lastCallAt))}${c.deal&&c.deal.value?' · '+euro(c.deal.value):''}</small></span></button>`).join('')||'<div class="muted">Nessuno</div>'}
        ${list.length>40?`<div class="muted">Altri ${list.length-40}: usa i filtri dell'elenco.</div>`:''}</div>`; }).join('')}</div>`;
}
const TPL_OUT = () => OUTCOMES.filter(o=>!['wrong','dnc'].includes(o.id));
function smartOrder(fresh){
  const m=new Map(), tb={M:{n:0,r:0},F:{n:0,r:0}}, band=bandOf(new Date().getHours()), isMob=c=>/^\+393/.test(c.phone)?'M':'F'; let N=0,R=0;
  for(const c of contacts) for(const k of c.calls){
    const key=c.info||''; let g=m.get(key); if(!g){ g={n:0,r:0}; m.set(key,g); }
    const ok=isReached(k); g.n++; N++; if(ok){ g.r++; R++; }
    if(bandOf(new Date(k.at).getHours())===band){ const t=tb[isMob(c)]; t.n++; if(ok) t.r++; }
  }
  const base=N?R/N:0;
  const score=c=>{ const g=m.get(c.info||''), t=tb[isMob(c)];
    return (g&&g.n>=20 ? g.r/g.n : base) * (t.n>=20 && base ? (t.r/t.n)/base : 1); };
  return fresh.map((c,i)=>[c,score(c),i]).sort((x,y)=>(y[1]-x[1])||(x[2]-y[2])).map(x=>x[0]);
}
function extraDataCards(){
  const t=settings.tpl||{};
  const si=Math.min(settings.scripts.length-1, editScript);
  return `<div class="card"><h3>Script di chiamata</h3><p class="muted">Compaiono nella scheda Chiama, dove scegli quale usare. Lo script scelto viene registrato su ogni chiamata, così nelle statistiche vedi quale rende di più.</p>
      <label>Script da modificare<select id="setScriptSel">${scriptOpts(si)}</select></label>
      <label>Nome<input type="text" id="setScriptName" value="${esc(settings.scripts[si].name)}"></label>
      <label>Testo<textarea id="setScript" style="min-height:220px">${esc(settings.scripts[si].text)}</textarea></label>
      <div class="row"><button class="btn grow" data-act="saveScript">Salva questo script</button><button class="btn grow" data-act="addScript">Aggiungi uno script nuovo</button></div>
      <label>Risposte alle obiezioni<textarea id="setObj" style="min-height:220px">${esc(settings.objText||'')}</textarea></label>
      <button class="btn" data-act="saveObj">Salva le risposte</button></div>
    <div class="card"><h3>Messaggi WhatsApp</h3><p class="muted">Un testo per ogni esito. Puoi usare {giorno} {ora} {zoom} {link}: l'app li sostituisce. Lascia vuoto per non proporre il messaggio.</p>
      ${TPL_OUT().map(o=>`<label>${esc(o.label)}<textarea id="tpl_${o.id}">${esc(t[o.id]||'')}</textarea></label>`).join('')}
      <button class="btn" data-act="saveTpl">Salva messaggi</button></div>`;
}

/* ---------- eventi ---------- */
let wipeArmed=0;
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==='overlay'){ if(e.target===el) closeSheet(); return; }
  switch(act){
    case 'tab': tab=id; shown=60; render(); break;
    case 'list': listFilter=id; shown=60; render(); break;
    case 'status': statusFilter=id; shown=60; render(); break;
    case 'period': period=id; statRows=31;
      if(id==='custom' && !statFrom){ const d=new Date(); statTo=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); statFrom=statTo.slice(0,8)+'01'; }
      render(); break;
    case 'group': groupBy=id; statRows=31; render(); break;
    case 'moreStats': statRows+=31; render(); break;
    case 'expStats': expStats(); break;
    case 'more': shown+=100; render(); break;
    case 'open': contactSheet(id); break;
    case 'newNum': newNumSheet(); break;
    case 'addNum': addNum(id, $('#nPhone').value, $('#nName').value.trim(), $('#nCompany').value.trim()); break;
    case 'key': if(dial.length<16){ dial+=id; $('#dialNum').textContent=dial; } break;
    case 'bksp': dial=dial.slice(0,-1); $('#dialNum').innerHTML = esc(dial)||'<span class="muted">Scrivi il numero con i tasti</span>'; break;
    case 'dialGo': addNum(id, dial, $('#dName').value.trim(), ''); break;
    case 'close': closeSheet(); break;
    case 'call':   // il link tel: apre il telefono; qui si segna solo l'ora di partenza
      pending={id,t0:Date.now()}; lsSet('pendingCall',pending);
      setTimeout(()=>{ closeSheet(); tab='call'; render(); },400); break;
    case 'cancelPending': pending=null; lsSet('pendingCall',null); render(); break;
    case 'outcome': outcomeSheet(id, pending&&pending.id===id ? (Date.now()-pending.t0)/1000 : 0); break;
    case 'fixOutcome': outcomeSheet(id, 0, true); break;
    case 'statTab': statTab=id; render(); break;
    case 'cView': cView=id; render(); break;
    case 'saveProfile': saveProfile(id); break;
    case 'saveDeal': saveDeal(id); break;
    case 'logWa': { const c=byId(id); if(c){ (c.acts=c.acts||[]).push({at:Date.now(), type:el.dataset.type||'WhatsApp'}); saveContact(c); } break; }
    case 'summary': summarySheet(); break;
    case 'copySum': { const t=$('#sumText'); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Testo copiato'),()=>{ t.select(); toast('Seleziona e copia il testo'); }); }catch(err){ t.select(); toast('Seleziona e copia il testo'); } break; }
    case 'saveScript': { const i=Math.min(settings.scripts.length-1, editScript), n=$('#setScriptName').value.trim()||('Script '+(i+1));
      settings.scripts[i]={name:n, text:$('#setScript').value.trim()}; saveMeta(); render(); toast('Script salvato'); break; }
    case 'addScript': settings.scripts.push({name:'Script '+(settings.scripts.length+1), text:''}); editScript=settings.scripts.length-1; saveMeta(); render(); toast('Script aggiunto: scrivi nome e testo, poi salva'); break;
    case 'saveObj': settings.objText=$('#setObj').value.trim(); saveMeta(); toast('Risposte salvate'); break;
    case 'saveTpl': TPL_OUT().forEach(o=>{ settings.tpl[o.id]=$('#tpl_'+o.id).value.trim(); }); saveMeta(); toast('Messaggi salvati'); break;
    case 'requeue': { const c=byId(id); c.status='new'; c.attempts=0; c.callbackAt=null; saveContact(c); render(); contactSheet(id); toast('Rimesso tra i Da chiamare'); break; }
    case 'pick': {
      oSel=id; document.querySelectorAll('.out').forEach(b=>b.setAttribute('aria-pressed', b.dataset.id===id));
      const o=OUT[id]; $('#oDateBox').hidden=!o.date;
      if(o.date) $('#oDateLbl').textContent = id==='appointment' ? 'Data e ora dell\'appuntamento' : o.date==='req' ? 'Quando richiamare' : 'Prossimo contatto (facoltativo)';
      break; }
    case 'quick': {
      const d=new Date();
      if(id==='2h') d.setHours(d.getHours()+2);
      else { d.setDate(d.getDate()+(id==='tom'?1:id==='3d'?3:7)); d.setHours(10,0,0,0); }
      $('#oDate').value = toLocalInput(d.getTime()); break; }
    case 'saveOutcome': saveOutcome(id); break;
    case 'skip': skipped.add(id); render(); break;
    case 'unskip': skipped.clear(); render(); break;
    case 'saveNote': { const c=byId(id); c.note=$('#cNote').value.trim(); saveContact(c); toast('Nota salvata'); render(); break; }
    case 'delContact':
      if(el.dataset.armed){ contacts=contacts.filter(c=>c.id!==id); idb('contacts','readwrite',s=>s.delete(id)); closeSheet(); render(); toast('Contatto eliminato'); }
      else { el.dataset.armed='1'; el.textContent='Tocca di nuovo per eliminare'; }
      break;
    case 'importCsv': $('#fileCsv').click(); break;
    case 'doImport': doImport(); break;
    case 'demo': demo(); break;
    case 'expContacts': expContacts(); break;
    case 'expCalls': expCalls(); break;
    case 'expCRM': expCRM(); break;
    case 'backup': backup(); break;
    case 'restore': $('#fileJson').click(); break;
    case 'saveSettings':
      settings.prefix = ($('#setPrefix').value.trim()||'+39'); if(settings.prefix[0]!=='+') settings.prefix='+'+settings.prefix;
      settings.maxAttempts = Math.max(1, parseInt($('#setMax').value)||4);
      settings.goal = Math.max(0, parseInt($('#setGoal').value)||0); settings.smart = $('#setSmart').checked; saveMeta(); render(); toast('Impostazioni salvate'); break;
    case 'wipe':
      if(Date.now()-wipeArmed<5000){ contacts=[]; skipped.clear(); pending=null; lsSet('pendingCall',null); idb('contacts','readwrite',s=>s.clear()); render(); toast('Tutto cancellato'); }
      else { wipeArmed=Date.now(); el.textContent='Tocca di nuovo entro 5 secondi per confermare'; }
      break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ query=e.target.value; shown=60; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='sFrom'){ statFrom=e.target.value; render(); }
  if(e.target.id==='sTo'){ statTo=e.target.value; render(); }
  if(e.target.id==='scriptSel'){ lsSet('scriptSel', +e.target.value); $('#scriptText').textContent = curScript().text; }
  if(e.target.id==='setScriptSel'){ editScript=+e.target.value; render(); }
  if(e.target.id==='fTarget'){ statTarget=Math.max(1, parseInt(e.target.value)||1); render(); }
});
document.addEventListener('toggle', e=>{ const k=e.target.dataset && e.target.dataset.keep; if(k) lsSet(k, e.target.open||null); }, true);
$('#fileCsv').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rows = parseCSV(await readText(f));
  if(rows.length<2) return toast('Il file è vuoto o non è un CSV');
  importSheet(rows, f.name);
});
$('#fileJson').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return; restore(await f.text());
});
// Al ritorno dalla telefonata si apre da solo il pannello dell'esito con la durata stimata.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && pending && byId(pending.id) && Date.now()-pending.t0>1500 && !$('.overlay')){
    render(); outcomeSheet(pending.id, (Date.now()-pending.t0)/1000);
  }
});

normSettings();   // valori di partenza pronti anche prima che l'archivio sia caricato
(async function start(){
  db = await openDB();
  contacts = (await idb('contacts','readonly', s=>s.getAll())) || [];
  contacts.sort((a,b)=>((a.createdAt||0)-(b.createdAt||0)) || ((a.ord||0)-(b.ord||0)));
  settings = {...DEFAULTS, ...((await idb('meta','readonly', s=>s.get('settings')))||{})};
  normSettings();
  meta = (await idb('meta','readonly', s=>s.get('meta'))) || {};
  if(pending && !byId(pending.id)){ pending=null; lsSet('pendingCall',null); }
  render();
  if(pending) outcomeSheet(pending.id, (Date.now()-pending.t0)/1000);
})();
</script>
